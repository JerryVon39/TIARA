<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TIARA · 追番放送簿</title>
<link rel="icon" type="image/png" sizes="64x64" href="./icon-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
<meta name="theme-color" id="themeColor" content="#f7f8fa" />
<meta name="description" content="TIARA：本地离线的番组管家。今天看什么、还差几话、下一集什么时候。" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="netbar" id="netbar" hidden>
    <span id="netbarText">连不上本地服务</span>
    <button id="netbarRetry" type="button">重试</button>
  </div>
  <header class="bar" id="panelHeader">
    <div class="brand"><img class="avatar" src="./icon-64.png" alt="" width="38" height="38" /><div><span class="mark">TIARA</span><h1>追番放送簿</h1></div></div>
    <nav class="tabs" aria-label="番组视图">
      <button class="tab on" data-tab="today" aria-current="page">我的排片</button>
      <button class="tab" data-tab="season">本季</button>
      <button class="tab" data-tab="library">番库</button>
      <button class="tab" data-tab="catchup">补番</button>
    </nav>
    <form class="panel-search" id="panelSearch" role="search" aria-label="全番库">
      <input type="search" id="q" aria-label="搜索全番库" aria-controls="globalSearch" placeholder="搜索番名或别名" />
      <button type="button" id="clearSearch" aria-label="清除搜索" hidden>×</button>
    </form>
    <div class="tools">
      <button type="button" id="addWatchBtn" data-new-watch class="primary" aria-label="添加番剧">新增</button>
      <button type="button" id="reminderCenter">提醒中心</button>
      <button type="button" id="settingsNav">设置</button>
    </div>
  </header>

  <main id="panelMain">
    <section class="wrap" id="globalSearch" aria-label="全番库搜索结果" hidden></section>
    <div class="wrap" id="view"><div class="panel empty" role="status">正在读取本地番组库…</div></div>
  </main>

  <footer class="dock" id="panelFooter"><span id="footHint">TIARA · 本地番库</span></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="mask" id="mask" aria-hidden="true" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1"></div></div>

  <script src="./app.js"></script>
</body>
</html>
